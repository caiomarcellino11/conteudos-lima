<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        .badge{
            display: flex;
            background-color: rgb(158, 253, 253);
            color: #0369a1;
            padding: 10px;
            /* tentativa de definir um tamanho rigido */
            width: 150px;
            height: 60px;
            /* tentativa de espaçamento vertical */
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;

        }
        .btn-acao{
            display: block;
            width: 100px;
            background-color: #0284c7;
            color: white;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            align-items: center;
            text-decoration: none;
            border-radius: 4px;
        }
        .alerta-sistema{
            background: #fef08a;
            color: #854d0e;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #facc15;

            /* A linha abaixo ativa o modo fantasma do aviso */
            display: none;

        }
    </style>
</head>
<body>
    <div class="card-perfil">
        <h2> Perfil de jogador</h2>
        <p>Conquista recentes no sistema</p>

        <span class="badge">Nivel 99</span>
        <span class="badge">Mestre CSS</span>
        <span class="badge">VIP</span>


        <a href="#" class="btn-acao">Editar Perfil</a>
        <a href="#" class="btn-acao">Ver inventario</a>

        
        <div class="alerta-sistema">
            Manutenção programada
         </div>
    </div>
    
</body>
</html>
