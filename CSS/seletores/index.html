<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores</title>
    <style>
        /* estilizando com tag */
        p{
            color: #475569;
            font-size: 16px;
            background-color: aquamarine;
        }
        /* estilizando com class */
        .card-alerta{
            border-left: 4px solid #f59e0b;
        }  
        /* estilizando com ID */
        #player-principal{
            background-color: #fef08a;

        }
    </style>
</head>
<body>
    <p>
        Goku
    </p>
    <!-- esse paragrafo cotem uma class -->
    <p class="card-alerta">
        Sherlock
    </p>
    <!-- esse paragrafo contem uma class -->
    <p class="card-alerta" id="player-principal">
        Naruto
    </p> 
</body>
</html>
