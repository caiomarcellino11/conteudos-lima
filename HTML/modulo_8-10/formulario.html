<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML</title>
</head>

<body>

    <form action="">

        <label for="Nome">
            Nome:
        </label>
        <br>

        <input 
            type="text"
            id="Nome"
            name="Nome"
            placeholder="Digite seu Nome" required
        >

        <br><br>

        <label for="email">
            E-mail:
        </label>
        <br>

        <input 
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu E-mail" required>
        

        <br><br>

        <label for="senha">
            Senha:
        </label>
        <br>

        <input 
            type="password"
            id="senha"
            name="senha"
        >

        <br><br>
        <label for="Idade">
            idade:
        </label>
        <br>

        <input 
            type="number"
            id="idade"
            name="idade"
            min="18"
            max="120"
            required>

        <br><br>
        <label for="Telefone">
            Telefone:
        </label>
        <br>

        <input 
            type="tel"
            id="Telefone"
            name="Telefone"
            pattern="[0-9]{11}"
            placeholder="(00) 00000-0000"
        >
        

       
        <br><br>

        <button type="submit">
            Entrar
        </button>

    </form>

</body>
</html>
